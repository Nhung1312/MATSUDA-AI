<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#mathGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="8"/>
  
  <!-- Math Symbols & Book Icon -->
  <g fill="white" transform="translate(64, 64) scale(0.75)">
    <!-- Pi Symbol & Formula Graphic -->
    <path d="M120 160 C 120 130, 392 130, 392 160 C 392 175, 360 175, 360 160 L 320 160 L 320 340 C 320 370, 350 380, 370 370 L 370 395 C 330 410, 275 395, 275 340 L 275 160 L 215 160 L 195 380 L 150 380 L 175 160 L 135 160 C 120 160, 120 160, 120 160 Z" fill="white" fill-opacity="0.95"/>
    
    <!-- Square Root & Sigma Accents -->
    <circle cx="100" cy="110" r="24" fill="url(#accentGrad)" />
    <circle cx="410" cy="110" r="18" fill="#34d399" />
    <polygon points="400,320 440,360 400,400 380,380 405,360 380,340" fill="#fbbf24" />
  </g>
  
  <!-- App Label in Bottom Badge -->
  <rect x="96" y="380" width="320" height="72" rx="36" fill="#0f172a" fill-opacity="0.85"/>
  <text x="256" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="3">TOÁN THCS</text>
</svg>
