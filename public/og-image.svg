<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 900; }
    .subtitle { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 700; }
    .text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 500; }
    .math { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Glowing background orbs -->
  <circle cx="150" cy="120" r="240" fill="#4f46e5" opacity="0.25" filter="url(#glow)" />
  <circle cx="1050" cy="500" r="280" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />
  <circle cx="950" cy="150" r="180" fill="#9333ea" opacity="0.2" filter="url(#glow)" />

  <!-- Subtle Math Background Watermarks -->
  <g fill="#ffffff" opacity="0.04" class="math">
    <text x="80" y="550" font-size="140">∑</text>
    <text x="450" y="160" font-size="120">∫</text>
    <text x="820" y="320" font-size="90">√x² + y²</text>
    <text x="980" y="120" font-size="110">π</text>
    <text x="280" y="580" font-size="80">f(x) = ax + b</text>
    <text x="650" y="560" font-size="100">Δ = b² - 4ac</text>
  </g>

  <!-- Main Container Card -->
  <rect x="60" y="50" width="1080" height="530" rx="36" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" filter="url(#shadow)" />

  <!-- Header / Brand Icon -->
  <g transform="translate(120, 110)">
    <!-- Icon Container -->
    <rect width="84" height="84" rx="24" fill="url(#btnGrad)" />
    <!-- Sigma / Math Icon in Logo -->
    <text x="42" y="58" font-size="44" fill="#ffffff" text-anchor="middle" class="title">∑</text>

    <!-- Top Badge -->
    <rect x="108" y="8" width="230" height="34" rx="17" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
    <text x="223" y="31" font-size="14" fill="#a5b4fc" text-anchor="middle" class="subtitle">HỆ THỐNG TOÁN TRỰC TUYẾN</text>

    <text x="108" y="74" font-size="20" fill="#94a3b8" class="text">Lớp 6 • Lớp 7 • Lớp 8 • Lớp 9</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(120, 265)">
    <text x="0" y="0" font-size="58" fill="url(#accentGrad)" class="title">
      TOÁN THCS – LUYỆN THI &amp; KIỂM TRA
    </text>
    <text x="0" y="52" font-size="25" fill="#cbd5e1" class="subtitle">
      Nền tảng giao bài tập, tự chấm điểm thông minh &amp; chống gian lận
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(120, 395)">
    <!-- Pill 1: Chấm điểm tự động -->
    <g transform="translate(0, 0)">
      <rect width="260" height="54" rx="27" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="28" cy="27" r="14" fill="#0284c7" />
      <text x="28" y="32" font-size="16" fill="#ffffff" text-anchor="middle">⚡</text>
      <text x="54" y="34" font-size="16" fill="#f0f9ff" class="subtitle">Tự chấm điểm tức thì</text>
    </g>

    <!-- Pill 2: Anti-Cheat -->
    <g transform="translate(280, 0)">
      <rect width="280" height="54" rx="27" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      <circle cx="28" cy="27" r="14" fill="#4f46e5" />
      <text x="28" y="32" font-size="16" fill="#ffffff" text-anchor="middle">🛡️</text>
      <text x="54" y="34" font-size="16" fill="#e0e7ff" class="subtitle">Giám sát thi Anti-Cheat</text>
    </g>

    <!-- Pill 3: Trộn đề Shuffle -->
    <g transform="translate(580, 0)">
      <rect width="260" height="54" rx="27" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
      <circle cx="28" cy="27" r="14" fill="#9333ea" />
      <text x="28" y="32" font-size="16" fill="#ffffff" text-anchor="middle">🔀</text>
      <text x="54" y="34" font-size="16" fill="#fae8ff" class="subtitle">Trộn đề ngẫu nhiên</text>
    </g>
  </g>

  <!-- Bottom Bar Info -->
  <g transform="translate(120, 515)">
    <line x1="0" y1="0" x2="840" y2="0" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <text x="0" y="30" font-size="16" fill="#64748b" class="text">
      ✅ Đầy đủ SGK Kết nối tri thức, Cánh diều, Chân trời sáng tạo • Quét mã QR vào phòng thi ngay
    </text>
  </g>
</svg>
