name: Verify batch graded submission export

on:
  push:
    branches:
      - feat/batch-graded-submission-export-20261014
  pull_request:
    paths:
      - 'src/services/submissionExportService.ts'
      - 'src/pages/teacher/TeacherResults.tsx'
      - 'scripts/check-batch-submission-export.ts'
      - 'package.json'
      - '.github/workflows/batch-export.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Batch archive regression
        run: npm run check:batch-export
      - name: Individual archive regression
        run: node --import ./scripts/offline-test-guard.mjs --import tsx scripts/check-submission-export.ts /tmp/pro-ta-individual-export.zip
      - name: Submission limits regression
        run: npm run check:submission-limits
