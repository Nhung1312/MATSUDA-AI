name: Exam result safety (no deployment)
on:
  push:
    branches: ['fix/exam-review-storage-safety-20261023']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: exam-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: install
        run: npm install --ignore-scripts --no-audit --no-fund
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:result-safety
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:review-save
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:teacher-navigation
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:teacher-review-ui
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:submit-first-ui
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:exam-workflow
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:ai-efficiency
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:imports
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:strikeout
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:points
  deployed-rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check:submit-first-emulator
        env:
          CI: 'true'
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
