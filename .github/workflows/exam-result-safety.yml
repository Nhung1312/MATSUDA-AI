name: Exam result safety (no deployment)
on:
  push:
    branches: ['fix/exam-review-storage-safety-20261023']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: exam-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm run check:result-safety
      - run: npm run check:teacher-navigation
      - run: npm run check:exam-workflow
      - run: npm run check:ai-efficiency
      - run: npm run check:imports
      - run: npm run test:strikeout
      - run: npm run test:points
